{% set name = "napari-zelda" %}
{% set version = "0.1.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d0d9742643e51aa02f970703327c21aab4fd74b96bceb52f960322357aaf6455

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python >=3.7
    - setuptools-scm
  run:
    - datatable
    - json5
    - magicgui
    - matplotlib-base >=3.4.3
    - napari !=0.4.11
    - napari-plugin-engine >=0.1.4
    - numpy
    - pandas
    - python >=3.7
    - qtpy
    - scikit-image
    - scipy

test:
  imports:
    - napari_zelda
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/napari-zelda
  summary: 3D Image Segmentation and Parent-Child relation plugin for microscopy image analysis in napari
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/RoccoDAnt/napari-zelda

extra:
  recipe-maintainers:
    - jaimergp
